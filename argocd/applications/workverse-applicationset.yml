apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workverse-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: cortex
          - name: executor
          - name: flux
          - name: forger
          - name: mail-forger
          - name: n8n
          - name: orion
          - name: relay
          - name: scribe
          - name: space
          - name: stream
          - name: synapse
          - name: web
  template:
    metadata:
      name: "workverse-{{ .name }}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "10"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/arav-menon/staging-ops.git
        targetRevision: HEAD
        path: "prod/workverse/{{ .name }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: workverse
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
