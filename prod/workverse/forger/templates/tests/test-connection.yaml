apiVersion: v1
kind: Pod
metadata:
  name: '{{ include "forger.fullname" . }}-test-connection'
  labels: '{{- include "forger.labels" . | nindent 4 }}'
  annotations:
    "helm.sh/hook": test
spec:
  containers:
  - name: wget
    image: busybox
    command: [ 'wget' ]
    args: [ '{{ include "forger.fullname" . }}:{{ .Values.service.port | default 80 }}' ]
  restartPolicy: Never
